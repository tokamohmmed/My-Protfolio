<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة </title>
    <meta http-equiv="refresh" content="1">
    <link rel="stylesheet" href="./smart-calculator.css">
</head>
<body>
    <br>
    <h1>The Calculator:</h1>

    <div id="d1">
        <div class="display" id="d2">0</div>
         
         <button>7</button>
         <button>8</button>
         <button>9</button>
         <button class="del">DEL</button>
         <button class="ac">AC</button>
         <br> 
     
         <button>4</button>
         <button>5</button>
         <button>6</button>
         <button  class="operator">*</button>
         <button class="operator">/</button>
         <br> 

         <button>3</button>
         <button>2</button>
         <button>1</button>
         <button class="operator">+</button>
         <button class="operator">-</button>
         <br>

         <button>0</button>
         <button>00</button>
         <button>.</button>
         <button class="operator">Ans</button>
         <button class="equals">=</button>
         <br>
    </div>
</body>
</html>
